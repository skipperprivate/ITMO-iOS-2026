# Настройки SwiftLint для Quotely.
# Линтер запускается на этапе сборки (Build Phases → SwiftLint)
# и вручную командой `swiftlint` из этой папки.

included:
  - Quotely
  - QuotelyTests
  - QuotelyUITests

excluded:
  - Quotely.xcodeproj

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
  - superfluous_else
  - prefer_key_path
  - vertical_whitespace_opening_braces
  - unneeded_throws_rethrows
  - empty_count
  - first_where
  - closure_spacing

line_length:
  warning: 100
  error: 150
  ignores_comments: true

function_body_length:
  warning: 30
  error: 80

type_body_length:
  warning: 150
  error: 300

file_length:
  warning: 200
  error: 500

identifier_name:
  min_length: 2
  excluded:
    - id

cyclomatic_complexity:
  warning: 8
  error: 15

reporter: xcode
