# Keep existing style issues visible without blocking the course project build.
lenient: true

included:
  - Weatherly

reporter: xcode

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

# Additional checks: unsafe optional unwrapping and collection emptiness.
opt_in_rules:
  - force_unwrapping
  - empty_count

# Allow conventional abbreviations while keeping other name checks enabled.
identifier_name:
  excluded:
    - id
    - km
    - uv

# Keep functions small enough to read and test.
function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 5
  error: 8
